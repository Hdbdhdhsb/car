# 嵌入式 C 静态分析（cppcheck）
#
# 目标：Keil C251（8051/251 内核）工程。只检测【用户代码】，
# 刻意不加 libraries/ 的 include 路径 —— 因为 zf 库满是 sbit/sfr/interrupt/using
# 这类 cppcheck 不认识的 8051 扩展，加了会满屏误报。
# 用 -D 补上 zf 派生的基本类型，让用户代码能正确类型检查。
#
# ⚠️ 首跑 = report-only（continue-on-error: true）：发现问题只标记/上传报告，不阻塞合并。
#    硬门禁：把 continue-on-error 改 false，并放开 Summary 步 error>0 时的 exit 1。
name: Static Analysis (cppcheck)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: cppcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppcheck:
    name: cppcheck (user code)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          cppcheck --version

      - name: Run cppcheck
        id: cppcheck
        # 首跑只标记不阻塞。硬门禁：continue-on-error 改 false + Summary 里 error>0 时 exit 1。
        continue-on-error: true
        shell: bash
        # 本地 WSL2 cppcheck 2.13.0 实测：user code 无 error 级别问题。
        # 抑制项说明 —— 只压「纯风格、永不可动」的两类：
        #   variableScope          变量声明作用域（内嵌化，纯审美）
        #   constParameterPointer  参数可加 const（此处多为会被修改的引用，不适用）
        # 其余（knownConditionTrueFalse / unreadVariable / oppositeInnerCondition /
        # performance / portability）全保留 —— 这些可能是真 bug，得让人看见。
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --suppress=unmatchedSuppression \
            --suppress=variableScope \
            --suppress=constParameterPointer \
            --std=c99 \
            --language=c \
            -I project/code \
            -I project/code/Camera \
            -I project/code/PID \
            -I project/code/Contact_master \
            -I project/user \
            -DMT9V03X_W=160 \
            -DMT9V03X_H=120 \
            -DBORDER_MIN=0 \
            -DBORDER_MAX=159 \
            -Duint8=unsigned\ char \
            -Duint16=unsigned\ short \
            -Duint32=unsigned\ long \
            -Dint8=signed\ char \
            -Dint16=short \
            -Dint32=long \
            -Duint=unsigned\ int \
            project/code project/user 2>&1 | tee cppcheck.log

      - name: Annotate findings
        if: always()
        shell: bash
        run: |
          # 把 cppcheck.log 里的 error/warning 诊断转成 GitHub 注解（可点、跳转到仓库对应文件行）。
          # 只注解 error/warning；style/performance/portability 留在 cppcheck.log 工件里作深读。
          if [ ! -f cppcheck.log ]; then echo "no cppcheck.log"; exit 0; fi
          while IFS= read -r line; do
            if [[ "$line" =~ ^([A-Za-z0-9_./-]+):([0-9]+):([0-9]+):\ (error|warning):\ (.*) ]]; then
              file="${BASH_REMATCH[1]}"; ln="${BASH_REMATCH[2]}"; col="${BASH_REMATCH[3]}"; sev="${BASH_REMATCH[4]}"; msg="${BASH_REMATCH[5]}"
              echo "::${sev} file=${file},line=${ln},col=${col}::${msg}"
            fi
          done < cppcheck.log

      - name: Summary
        if: always()
        shell: bash
        # cppcheck 输出是纯文本 `file:行:列: severity: message`，不是 XML，所以按 `: error:` 统计。
        # 硬门禁开关：现在 report-only 只发 ::warning::；要变硬失败，把 if 里的 exit 1 取消注释。
        run: |
          errors=$(grep -c ': error:' cppcheck.log || true)
          warnings=$(grep -c ': warning:' cppcheck.log || true)
          styles=$(grep -c ': style:' cppcheck.log || true)
          echo "cppcheck results this run:"
          echo "  error:   $errors"
          echo "  warning: $warnings"
          echo "  style:   $styles"
          if [ "$errors" -gt 0 ]; then
            echo "::warning::cppcheck found $errors error issue(s). Download the cppcheck-report artifact and review before enabling the hard gate."
            # exit 1   # ← 硬门禁时取消注释
          else
            echo "No error issues in user code."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.log
